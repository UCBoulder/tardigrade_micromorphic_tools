schema_version: 1

context:
  name: tardigrade_micromorphic_tools
  version: 0.0.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  skip: win
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - set -x
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib # Conda-forge feedstock must replace ``-DCMAKE_INSTALL_LIBDIR=lib`` with ``${CMAKE_ARGS}``
      - cmake --build build --target tardigrade_micromorphic_tools
      - cmake --install build --prefix ${PREFIX}

requirements:
  build:
    - python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('cxx') }}  # Conda-forge feedstock also requires ``{{ stdlib('c') }}`, but this breaks the in-repo recipe.
    - make
    - cmake >=3.30
    - breathe >=4.3.0
    - clang-tools
    - doxygen
    - libboost-python-devel >=1.82
    - pip
    - python-build
    - setuptools >=77
    - setuptools_scm >=8
    - sphinx >=3.0.4
    - sphinx_rtd_theme >=0.4.3
    - sphinxcontrib-bibtex
  host:
    - setuptools >=77
    - setuptools_scm >=8
    - eigen >=3.3.7
    - eigen-abi-devel
    - tardigrade_error_tools >=0.9.8
    - tardigrade_vector_tools >=0.8.7
    - tardigrade_constitutive_tools >=0.8.5
  run:
    - eigen >=3.3.7
  run_exports:
    - ${{ pin_subpackage(name|lower, upper_bound='x.x') }}

tests:
  - files:
      source:
        - CMakeLists.txt
        - src/cpp/tests/CMakeLists.txt
        - src/cpp/tests/test_tardigrade_micromorphic_tools.cpp
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - make
        - cmake >=3.30
        - clang-tools
        - libboost-python-devel >=1.82
        - doxygen
        - sphinx >=3.0.4
    script:
      - set -x
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=conda-test -DCMAKE_INSTALL_LIBDIR=lib
      - cmake --build build --target all --verbose --parallel 4
      - ctest --test-dir build --output-on-failure -R 'test_' --parallel 4

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A collection of useful tools and utilities for micromorphic continuum mechanics
  description: |
    tardigrade_micromorphic_tools A collection of useful tools and utilities for micromorphic
    continuum mechanics. These utilities are intended to reduce the implementation time of  constitutive model
    development by providing a library of functions which are verified and ready to be implemented.
  homepage: https://github.com/UCBoulder/tardigrade_micromorphic_tools/
  repository: https://github.com/UCBoulder/tardigrade_micromorphic_tools/
